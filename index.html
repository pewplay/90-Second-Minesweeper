<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>90-Second Minesweeper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="lcd" id="flags" aria-label="Flags left">20</div>
      <button id="face" type="button" aria-label="New game">🙂</button>
      <div class="lcd" id="timer" aria-label="Seconds left">90</div>
    </div>
    <div id="timebar" aria-hidden="true"><i></i></div>
    <div id="wrap">
      <div id="board" role="grid" aria-label="Minefield"></div>
      <div id="dialog" class="hidden" role="dialog" aria-modal="false" aria-labelledby="dlgTitle">
        <div class="card">
          <div class="dlg-face" id="dlgFace">😎</div>
          <h2 id="dlgTitle">You win!</h2>
          <p id="dlgText"></p>
          <p id="dlgBest" class="best"></p>
          <div class="row">
            <button type="button" id="dlgView" class="btn ghost">View board</button>
            <button type="button" id="dlgNew" class="btn">New game</button>
          </div>
        </div>
      </div>
    </div>
    <div id="tools">
      <button type="button" id="mode" class="btn mode" aria-pressed="false">
        <span class="ico-flag" aria-hidden="true"></span><span id="modeLabel">Flag mode: off</span>
      </button>
      <div id="status" aria-live="polite">Tap any square to start the clock</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
