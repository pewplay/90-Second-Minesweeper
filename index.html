<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>90-Second Minesweeper</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="flag-box" aria-label="Flags left"><h1>0<span id="flags-left"></span></h1></div>
      <button class="emoji-btn" aria-label="New game"><h1>🙂</h1></button>
      <div class="timer-box" aria-label="Seconds"><h1><span id="timer">0</span></h1></div>
    </div>
    <div class="grid"></div>
    <div id="result"></div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
